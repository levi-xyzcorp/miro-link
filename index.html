<div id="msg">MIRO 콘솔로 연결 중…</div>
<script>
// 고정 QR → 현재 터널로 중계. 토큰은 QR 쿼리(?t=)로만 전달 — 저장소엔 미보관.
var target = "https://brass-shark-wife-micro.trycloudflare.com"; // AUTO-UPDATED by miro_tunnel

location.replace(target + "/" + (m ? "?token=" + m[1] : ""));

  document.getElementById("msg").innerHTML =
    "연결이 안 되면 터널이 꺼져 있는 상태입니다 — 관리자에게 문의하세요.";
}, 4000);
</script>

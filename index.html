<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MIRO 콘솔 연결 중…</title>
<body style="font-family:sans-serif;display:flex;justify-content:center;align-items:center;height:90vh;background:#111;color:#eee">
<div id="msg">MIRO 콘솔로 연결 중…</div>
<script>
// 고정 QR → tunnel.json(캐시 우회 조회) → 현재 터널. 토큰은 QR 쿼리로만 전달.
var mt = /(?:^|[?&])t=([^&]+)/.exec(location.search);
var tail = mt ? "?token=" + mt[1] : "";
fetch("tunnel.json?_=" + Date.now(), {cache: "no-store"})
  .then(function (r) { return r.json(); })
  .then(function (j) { location.replace(j.url + "/" + tail); })
  .catch(function () {
    document.getElementById("msg").innerHTML =
      "연결 실패 — 터널이 꺼져 있거나 갱신 중입니다(1~2분 후 새로고침).";
  });
setTimeout(function () {
  var el = document.getElementById("msg");
  if (el) el.innerHTML += "<br>안 넘어가면 새로고침 해주세요.";
}, 5000);
</script>
</body>
</html>
